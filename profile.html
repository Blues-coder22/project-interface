<!doctype html><html lang="en" data-auth="tourist"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tourist profile — StayExplore Kenya</title><link rel="stylesheet" href="css/style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%230d3b2e%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 fill=%27white%27 text-anchor=%27middle%27 font-family=%27Georgia%27%3ESE%3C/text%3E%3C/svg%3E"><script src="js/app.js"></script><noscript><style>html.se-pending body{visibility:visible!important}</style></noscript></head><body><header class="public-nav" data-site-nav></header><main class="page"><div class="eyebrow">Account</div><h1>Tourist profile.</h1><p class="sub">Keep your contact and account details current.</p><div class="grid grid-2" style="margin-top:22px"><div class="card pad" style="text-align:center"><div class="profile-avatar" data-avatar style="width:78px;height:78px;border-radius:50%;background:#dce8df;color:var(--forest);display:grid;place-items:center;margin:0 auto 14px;font-family:Georgia,serif;font-size:22px"><span data-user="initials"></span></div><h3 data-user="name"></h3><p class="small">Tourist account · Verified</p><button type="button" class="btn btn-outline btn-sm" data-action="change-photo" data-input="#profilePhotoInput">Change photo</button><input id="profilePhotoInput" data-photo-input type="file" accept="image/*" hidden></div><form class="card pad grid" data-profile-form data-success="Profile updated"><div class="field"><label for="p-name">FULL NAME</label><input id="p-name" name="name" data-user="name" required minlength="2" autocomplete="name"></div><div class="field"><label for="p-email">EMAIL</label><input id="p-email" name="email" type="email" data-user="email" required autocomplete="email"></div><div class="field"><label for="p-phone">PHONE</label><input id="p-phone"
