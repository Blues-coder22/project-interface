<!DOCTYPE html>
<html lang="en" data-auth="admin">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Manage attractions — StayExplore Kenya</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%230d3b2e%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 fill=%27white%27 text-anchor=%27middle%27 font-family=%27Georgia%27%3ESE%3C/text%3E%3C/svg%3E">
    <script src="js/app.js"></script>
    <noscript><style>html.se-pending body{visibility:visible!important}</style></noscript>
  </head>
  <body data-active="attractions">
    <div data-shell="">
      <div class="page-head">
        <div>
          <div class="eyebrow">Administration</div>
          <h1>Manage attractions</h1>
        </div>
      </div>
      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>Attraction</th>
              <th>County</th>
              <th>Category</th>
              <th>Nearby stays</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody data-admin-attractions=""></tbody>
        </table>
      </div>
      <div class="listing-form" style="margin-top:18px">
        <form id="attractionForm" class="card pad grid">
          <div class="eyebrow" id="attractionFormTitle">Add attraction</div>
          <div class="grid grid-3">
            <div class="field">
              <label for="t-name">NAME</label>
              <input id="t-name" name="name" required="" placeholder="Attraction name">
            </div>
            <div class="field">
              <label for="t-county">COUNTY</label>
              <input id="t-county" name="county" required="" placeholder="County">
            </div>
            <div class="field">
              <label for="t-cat">CATEGORY</label>
              <select id="t-cat" name="category"><option>Wildlife</option><option>Mountain</option><option>Nature</option><option>Culture</option><option>Beach</option></select>
            </div>
          </div>
          <div class="field">
            <label for="t-tag">SHORT SUMMARY (SHOWN ON THE CARD)</label>
            <input id="t-tag" name="tagline" placeholder="One sentence that sells the place">
          </div>
          <div class="field">
            <label for="t-desc">DESCRIPTION</label>
            <textarea id="t-desc" name="description" placeholder="Why visit?"></textarea>
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label for="t-terrain">LANDSCAPE</label>
              <input id="t-terrain" name="terrain" placeholder="e.g. Open, dry savannah">
            </div>
            <div class="field">
              <label for="t-best">BEST TIME TO GO</label>
              <input id="t-best" name="bestTime" placeholder="e.g. July – October">
            </div>
          </div>
          <div class="field">
            <label for="t-photos">PHOTOS (OPTIONAL, UP TO 3)</label>
            <input id="t-photos" name="photos" type="file" accept="image/*" multiple="multiple" data-preview="#attractionCover">
          </div>
          <div class="field">
            <label>PIN THE LOCATION ON THE MAP</label>
            <div class="pick-map" data-pick-map=""></div>
            <input type="hidden" name="lat">
            <input type="hidden" name="lng">
            <div class="actions" style="margin-top:8px;justify-content:space-between">
              <span class="small" data-pick-note="">Click the map to pin the exact location.</span>
              <button type="button" class="btn btn-outline btn-sm" data-pick-here="">Use my current location</button>
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="btn">Save attraction</button>
            <button type="button" class="btn btn-outline" id="attractionCancel" hidden="">Cancel edit</button>
          </div>
        </form>
        <aside class="card pad">
          <div class="image-upload photo" id="attractionCover" style="min-height:220px;text-align:center;padding:12px">Choose a photo or leave blank for a landscape-matched default</div>
          <p class="small" style="margin-top:12px">New attractions start as <strong>Draft</strong>. Use Publish in the table to show them to tourists.</p>
        </aside>
      </div>
    </div>
  </body>
</html>
