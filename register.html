<!doctype html><html lang="en" data-auth="guest"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create your account — StayExplore Kenya</title><link rel="stylesheet" href="css/style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%230d3b2e%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 fill=%27white%27 text-anchor=%27middle%27 font-family=%27Georgia%27%3ESE%3C/text%3E%3C/svg%3E"><script src="js/app.js"></script><noscript><style>html.se-pending body{visibility:visible!important}</style></noscript></head><body><header class="public-nav" data-site-nav></header><main class="auth-page"><section class="auth-visual"><div class="auth-copy"><div class="eyebrow" style="color:#efb59e">Join the journey</div><h1>Create your account</h1><p>Choose how you use StayExplore. Your account role controls which part of the website you can access.</p></div></section><section class="auth-form"><div class="auth-box"><div class="eyebrow">Join the journey</div><h1>Create your account.</h1><p class="small">It only takes a minute. You will be signed in automatically.</p><form id="registerForm" class="grid grid-2" autocomplete="on" style="margin-top:25px"><div class="field"><label>FULL NAME</label><input name="name" required autocomplete="name" placeholder="Amina Wanjiku"></div><div class="field"><label>EMAIL</label><input name="email" required type="email" autocomplete="email" placeholder="amina@example.com"></div><div class="field full"><label>PASSWORD</label><input name="password" required minlength="8" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div><div class="field full"><label>ACCOUNT TYPE</label><select name="role" required><option value="tourist">Tourist — search, book and review stays</option><option value="host">Host — list and manage properties</option></select></div><label class="check full"><input type="checkbox" required> By continuing, you agree to our terms and privacy policy.</label><button type="submit" class="btn full">Create account</button></form><p class="small" style="margin-top:18px">Already have an account? <a class="home-link" href="login.html">Sign in</a></p></div></section></main></body></html>
