<!DOCTYPE html>
<html lang="en" data-auth="host">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Manage bookings — StayExplore Kenya</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%230d3b2e%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 fill=%27white%27 text-anchor=%27middle%27 font-family=%27Georgia%27%3ESE%3C/text%3E%3C/svg%3E">
    <script src="js/app.js"></script>
    <noscript><style>html.se-pending body{visibility:visible!important}</style></noscript>
  </head>
  <body data-active="bookings">
    <div data-shell="">
      <div class="page-head">
        <div>
          <div class="eyebrow">Hosting</div>
          <h1>Manage bookings</h1>
        </div>
      </div>
      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>Guest</th>
              <th>Property</th>
              <th>Dates</th>
              <th>Amount</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody data-host-bookings=""></tbody>
        </table>
      </div>
      <div class="grid grid-3" style="margin-top:18px">
        <div class="kpi">
          <strong data-stat="bk-upcoming">0</strong>
          <span class="small">Upcoming bookings</span>
        </div>
        <div class="kpi">
          <strong data-stat="bk-done">0</strong>
          <span class="small">Completed stays</span>
        </div>
        <div class="kpi">
          <strong data-stat="bk-cancelled">0</strong>
          <span class="small">Cancelled</span>
        </div>
      </div>
    </div>
  </body>
</html>
