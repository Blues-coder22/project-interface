<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search results — StayExplore Kenya</title><link rel="stylesheet" href="css/style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%230d3b2e%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 fill=%27white%27 text-anchor=%27middle%27 font-family=%27Georgia%27%3ESE%3C/text%3E%3C/svg%3E"><script src="js/app.js"></script><noscript><style>html.se-pending body{visibility:visible!important}</style></noscript></head><body><header class="public-nav" data-site-nav></header><main class="page"><div class="page-head"><div><div class="eyebrow">Search</div><h1>Stays that feel like Kenya.</h1><p class="sub">Recommended stays and attractions around Nairobi.</p></div><button class="btn btn-outline" type="button" id="viewMap">View map</button></div><div data-tab-group class="tabs"><button type="button" class="tab active" data-target="stays">Accommodation</button><button type="button" class="tab" data-target="attractions">Attractions</button></div><section data-tab-panel="stays"><div class="split search-layout"><aside class="card pad" id="filters"><div class="filter-block"><div class="eyebrow">Where</div><input id="liveSearch" style="width:100%;padding:10px;border:1px solid var(--line);background:#fffdf9" placeholder="Search Nairobi..."></div><div class="grid grid-2" style="margin-top:15px"><div class="field"><label for="minPrice">MIN PRICE</label><input id="minPrice" type="number" min="0" inputmode="numeric" placeholder="KES"></div><div class="field"><label for="maxPrice">MAX PRICE</label><input id="maxPrice" type="number" min="0" inputmode="numeric" placeholder="KES"></div></div><div class="field" style="margin-top:15px"><label>RATING</label><label class="check"><input type="checkbox" data-min-rating="4.5"> 4.5 and above</label><label class="check"><input type="checkbox" data-min-rating="4"> 4.0 and above</label></div><div class="field" style="margin-top:15px"><label>AMENITIES</label><label class="check"><input type="checkbox" data-amenity="wifi"> Wi-Fi</label><label class="check"><input type="checkbox" data-amenity="breakfast"> Breakfast</label><label class="check"><input type="checkbox" data-amenity="parking"> Parking</label></div><button class="btn" type="button" id="applyFilters" style="width:100%;margin-top:18px">Apply filters</button><button class="btn btn-outline" type="button" id="resetFilters" style="width:100%;margin-top:8px">Reset</button></aside><div class="grid"><div class="card pad"><div class="actions" style="justify-content:space-between"><span class="small" id="resultCount">3 stays found</span><select id="sortBy" style="padding:8px;border:1px solid var(--line);background:#fffdf9"><option>Recommended</option><option>Lowest price</option><option>Highest rated</option></select></div></div><div id="stayList" class="grid"></div><div class="card pad empty" id="noResults" hidden><h3>No stays match your filters.</h3><p class="small">Try a different search or reset the filters.</p></div></div></div></section><section data-tab-panel="attractions" hidden><div class="grid grid-3" id="attractionList"></div></section></main><footer class="hp-footer" data-site-footer></footer></body></html>
