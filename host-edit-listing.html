<!DOCTYPE html>
<html lang="en" data-auth="host">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Edit Karura House — StayExplore Kenya</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%230d3b2e%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 fill=%27white%27 text-anchor=%27middle%27 font-family=%27Georgia%27%3ESE%3C/text%3E%3C/svg%3E">
    <script src="js/app.js"></script>
    <noscript><style>html.se-pending body{visibility:visible!important}</style></noscript>
  </head>
  <body data-active="listings">
    <div data-shell="">
      <div class="page-head">
        <div>
          <div class="eyebrow">Hosting</div>
          <h1 data-listing="title">Edit listing</h1>
        </div>
        <a class="btn btn-outline" href="host-manage-listings.html">Back to listings</a>
      </div>
      <div class="listing-form">
        <form id="listingForm" data-mode="host-edit" class="card pad grid">
          <div class="field">
            <label for="f-name">PROPERTY NAME</label>
            <input id="f-name" name="name" required="" minlength="3">
          </div>
          <div class="field">
            <label for="f-loc">LOCATION</label>
            <input id="f-loc" name="location" required="">
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label for="f-price">PRICE / NIGHT (KSH)</label>
              <input id="f-price" name="price" type="number" min="1" step="1" required="">
            </div>
            <div class="field">
              <label for="f-type">PROPERTY TYPE</label>
              <select id="f-type" name="type"><option>Apartment</option><option>Guest house</option><option>Lodge</option><option>Villa</option><option>Tented camp</option></select>
            </div>
          </div>
          <div class="field">
            <label for="f-desc">DESCRIPTION</label>
            <textarea id="f-desc" name="description" required="" minlength="10"></textarea>
          </div>
          <div class="grid grid-2">
            <div class="field">
              <label for="f-amen">AMENITIES (COMMA SEPARATED)</label>
              <input id="f-amen" name="amenities" placeholder="Wi-Fi, Breakfast, Parking">
            </div>
            <div class="field">
              <label for="f-rules">HOUSE RULES</label>
              <input id="f-rules" name="rules" placeholder="Check-in times, quiet hours...">
            </div>
          </div>
          <div class="field">
            <label for="f-photos">REPLACE PHOTOS (OPTIONAL, UP TO 4)</label>
            <input id="f-photos" name="photos" type="file" accept="image/*" multiple="multiple" data-preview="#listingCover">
          </div>
          <div class="field">
            <label>PIN THE LOCATION ON THE MAP</label>
            <div class="pick-map" data-pick-map=""></div>
            <input type="hidden" name="lat">
            <input type="hidden" name="lng">
            <div class="actions" style="margin-top:8px;justify-content:space-between">
              <span class="small" data-pick-note="">Click the map to pin the exact location.</span>
              <button type="button" class="btn btn-outline btn-sm" data-pick-here="">Use my current location</button>
            </div>
          </div>
          <button type="submit" class="btn">Save listing</button>
        </form>
        <aside class="card pad">
          <div class="photo" id="listingCover"></div>
          <div class="eyebrow" style="margin-top:14px">Current listing</div>
          <h3 data-listing="name"></h3>
          <p class="small" data-listing="status"></p>
          <a class="home-link" data-listing="link" href="details.html">View public listing</a>
        </aside>
      </div>
    </div>
  </body>
</html>
