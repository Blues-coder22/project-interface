<!doctype html><html lang="en" data-auth="host"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add a new stay — StayExplore Kenya</title><link rel="stylesheet" href="css/style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%230d3b2e%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 fill=%27white%27 text-anchor=%27middle%27 font-family=%27Georgia%27%3ESE%3C/text%3E%3C/svg%3E"><script src="js/app.js"></script><noscript><style>html.se-pending body{visibility:visible!important}</style></noscript></head><body data-active="add"><div data-shell><div class="page-head"><div><div class="eyebrow">Hosting</div><h1>Add a new stay</h1></div></div><div class="listing-form"><form id="listingForm" data-mode="host-add" class="card pad grid"><div class="field"><label for="f-name">PROPERTY NAME</label><input id="f-name" name="name" required minlength="3" placeholder="Karura House"></div><div class="field"><label for="f-loc">LOCATION</label><input id="f-loc" name="location" required placeholder="Gigiri, Nairobi"></div><div class="grid grid-2"><div class="field"><label for="f-price">PRICE / NIGHT (KSH)</label><input id="f-price" name="price" required type="number" min="1" step="1" placeholder="8400"></div><div class="field"><label for="f-type">PROPERTY TYPE</label><select id="f-type" name="type"><option>Apartment</option><option>Guest house</option><option>Lodge</option><option>Villa</option><option>Tented camp</option></select></div></div><div class="field"><label for="f-desc">DESCRIPTION</label><textarea id="f-desc" name="description" required minlength="10" placeholder="Describe the property, setting and what guests can expect."></textarea></div><div class="grid grid-2"><div class="field"><label for="f-amen">AMENITIES (COMMA SEPARATED)</label><textarea id="f-amen" name="amenities" placeholder="Wi-Fi, breakfast, parking..."></textarea></div><div class="field"><label for="f-rules">HOUSE RULES</label><textarea id="f-rules" name="rules" placeholder="Check-in times, quiet hours..."></textarea></div></div><button type="submit" class="btn">Submit listing</button></form><aside class="grid"><div class="card pad"><div class="eyebrow">Property photos</div><div class="image-upload" id="addPreview">Choose photos below. If you skip this, we use a landscape-matched default.</div><input type="file" name="photos" form="listingForm" multiple accept="image/*" style="margin-top:12px" data-preview="#addPreview"></div><div class="card pad"><div class="eyebrow">Approval</div><h3>What happens next?</h3><p class="small">Your listing is reviewed by an administrator before it becomes visible to tourists. You can edit it any time from Manage listings.</p></div></aside></div></div></body></html>
