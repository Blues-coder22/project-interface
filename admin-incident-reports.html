<!DOCTYPE html>
<html lang="en" data-auth="admin">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Incident reports — StayExplore Kenya</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%230d3b2e%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-size=%2713%27 fill=%27white%27 text-anchor=%27middle%27 font-family=%27Georgia%27%3ESE%3C/text%3E%3C/svg%3E">
    <script src="js/app.js"></script>
    <noscript><style>html.se-pending body{visibility:visible!important}</style></noscript>
  </head>
  <body data-active="incidents">
    <div data-shell="">
      <div class="page-head">
        <div>
          <div class="eyebrow">Administration</div>
          <h1>Incident reports</h1>
        </div>
        <select id="incidentFilter" aria-label="Filter incidents" style="padding:9px;border:1px solid var(--line)"><option value="all">All reports</option><option value="critical">Critical only</option><option value="open">Open</option><option value="investigating">Investigating</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option></select>
      </div>
      <div class="grid grid-4" style="margin-bottom:18px">
        <div class="kpi" style="border-color:#e3b3ab">
          <strong data-stat="inc-critical">0</strong>
          <span class="small">Critical, unresolved</span>
        </div>
        <div class="kpi">
          <strong data-stat="inc-open">0</strong>
          <span class="small">Open</span>
        </div>
        <div class="kpi">
          <strong data-stat="inc-inv">0</strong>
          <span class="small">Investigating</span>
        </div>
        <div class="kpi">
          <strong data-stat="inc-res">0</strong>
          <span class="small">Closed</span>
        </div>
      </div>
      <div class="card table-wrap">
        <table>
          <thead>
            <tr>
              <th>Report</th>
              <th>Reported by</th>
              <th>Against</th>
              <th>Type</th>
              <th>Date</th>
              <th>Status</th>
              <th></th>
            </tr>
          </thead>
          <tbody data-admin-incidents=""></tbody>
        </table>
      </div>
      <div class="card pad" id="incidentPanel" hidden="" style="margin-top:18px">
        <div class="eyebrow">Incident</div>
        <h2 id="incTitle"></h2>
        <p class="small" id="incMeta"></p>
        <p id="incDesc" style="margin-top:12px"></p>
        <p class="small" id="incEvidence"></p>
        <div class="eyebrow" style="margin-top:18px">Immediate actions</div>
        <div class="actions" id="incActions" style="margin-top:6px"></div>
        <div class="eyebrow" style="margin-top:18px">Internal notes</div>
        <div id="incNotes"></div>
        <form id="incidentAdminForm" class="grid" style="margin-top:14px">
          <div class="grid grid-2">
            <div class="field">
              <label for="ia-status">STATUS</label>
              <select id="ia-status" name="status"><option value="open">Open</option><option value="investigating">Investigating</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option></select>
            </div>
            <div class="field">
              <label for="ia-note">ADD INTERNAL NOTE</label>
              <input id="ia-note" name="note" placeholder="Visible to administrators only">
            </div>
          </div>
          <div class="field">
            <label for="ia-res">MESSAGE TO THE REPORTER (REQUIRED WHEN CLOSING)</label>
            <textarea id="ia-res" name="resolution" placeholder="Explain the outcome."></textarea>
          </div>
          <div class="actions">
            <button type="submit" class="btn">Save</button>
            <button type="button" class="btn btn-outline" id="incClose">Close</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
